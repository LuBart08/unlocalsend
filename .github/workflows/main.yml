name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour publier la release

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl git \
            python3 zip unzip xz-utils bzip2 libxml2 dpkg

      - name: Installer Theos
        run: git clone --recursive https://github.com/theos/theos.git "$THEOS"

      - name: Installer le toolchain iOS
        run: |
          # libtinfo5 n'existe plus sur Ubuntu 22.04 : lien de secours
          sudo apt-get install -y libtinfo5 || \
            sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          TMP=$(mktemp -d)
          curl -fsSL -o "$TMP/toolchain.tar.lzma" \
            https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma
          tar -xf "$TMP/toolchain.tar.lzma" -C "$TMP"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          mv "$TMP"/ios-arm64e-clang-toolchain/* "$THEOS/toolchain/linux/iphone/"
          ls "$THEOS/toolchain/linux/iphone/bin" | head

      - name: Cache du SDK iOS 6.1
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}/sdks/iPhoneOS6.1.sdk
          key: ios-sdk-6.1-v2

      - name: Télécharger le SDK iOS 6.1
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          SDKDIR="$THEOS/sdks/iPhoneOS6.1.sdk"
          HDR="$SDKDIR/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"
          mkdir -p "$THEOS/sdks"

          from_folder() {   # $1 = URL du dépôt contenant le dossier iPhoneOS6.1.sdk
            rm -rf /tmp/sdkrepo "$SDKDIR"
            git clone --depth 1 --filter=blob:none --sparse "$1" /tmp/sdkrepo || return 1
            git -C /tmp/sdkrepo sparse-checkout set iPhoneOS6.1.sdk || return 1
            cp -a /tmp/sdkrepo/iPhoneOS6.1.sdk "$SDKDIR" || return 1
            [ -f "$HDR" ]
          }

          from_archive() {  # archive .tbz2 dans yaolinjun/theos-sdks-1
            rm -rf /tmp/sdkrepo "$SDKDIR"
            git clone --depth 1 --filter=blob:none --sparse \
              https://github.com/yaolinjun/theos-sdks-1.git /tmp/sdkrepo || return 1
            git -C /tmp/sdkrepo sparse-checkout set --no-cone iPhoneOS6.1.sdk.tbz2 || return 1
            tar -xjf /tmp/sdkrepo/iPhoneOS6.1.sdk.tbz2 -C "$THEOS/sdks" || return 1
            [ -f "$HDR" ]
          }

          from_folder https://github.com/Sn0wCooder/theos-sdks.git \
            || from_folder https://github.com/EachAndOther/Legacy-iOS-SDKs.git \
            || from_archive \
            || { echo "::error::SDK iOS 6.1 introuvable ou incomplet"; exit 1; }

          echo "SDK OK :"; ls "$THEOS/sdks"

      - name: Vérifier le SDK et le Makefile
        run: |
          ls -la "$THEOS/sdks/"
          test -f "$THEOS/sdks/iPhoneOS6.1.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"
          grep -nE 'TARGET|SDK|SYSROOT' Makefile || true

      - name: Diagnostic libheif / libc++
        run: |
          ls -la vendor/heic-ios vendor/heic-ios/lib
          find vendor/heic-ios -maxdepth 2 \( -name "*.sh" -o -name "README*" -o -name "CMakeLists.txt" -o -name "Makefile" \) || true
          ls "$THEOS/sdks/iPhoneOS6.1.sdk/usr/lib" | grep -Ei 'c\+\+|stdc' || true
          file vendor/heic-ios/lib/*.a || true

      - name: Build (.deb)
        run: make package FINALPACKAGE=1 DEBUG=0

      - name: Créer l'IPA
        run: python3 scripts/package_ipa.py

      - name: Lister les artefacts
        run: ls -lR packages *.ipa 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: localsend6
          path: |
            packages/*.deb
            **/*.ipa
          if-no-files-found: error

      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            **/*.ipa
